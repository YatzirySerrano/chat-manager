; Chat Manager — WhatsApp Web (QR) service (services/whatsapp-web).
; Optional: install it only when the WhatsApp Web (QR) modality is used.
;   sudo cp deploy/supervisor/chat-manager-whatsapp-web.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; One process, never more: the service holds one WhatsApp socket per linked
; number and refuses to start twice over the same data (service.lock), so
; numprocs must stay at 1.
;
; User: a system account without shell or sudo (chatmanager-wa). It only
; needs to read the release and its env file, and to write its own data
; directory (WAWEB_DATA_DIR, /var/lib/chatmanager/whatsapp-web), which lives
; outside the releases so a deployment never touches the linked sessions.
; It is not www-data: PHP never reads the WhatsApp credentials.
;
; Environment: /var/www/chat-manager/shared/whatsapp-web.env (root:chatmanager-wa,
; chmod 640), read by the service itself (WAWEB_ENV_FILE). Copy it from
; services/whatsapp-web/.env.example.
;
; Stop: SIGTERM closes the sockets without logging any device out and waits
; for the pending credential writes; stopwaitsecs covers that (the service
; exits by itself after 15 s at most).
;
; Paths: /var/www/chat-manager/current is the active release and /usr/bin/node
; the Node.js 20+ binary (adjust both; `command -v node`).

[program:chatmanager-whatsapp-web]
command=/usr/bin/node dist/index.js
directory=/var/www/chat-manager/current/services/whatsapp-web
user=chatmanager-wa
environment=NODE_ENV="production",WAWEB_ENV_FILE="/var/www/chat-manager/shared/whatsapp-web.env",HOME="/var/lib/chatmanager/whatsapp-web"
umask=077
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/whatsapp-web.log
stdout_logfile_maxbytes=0
