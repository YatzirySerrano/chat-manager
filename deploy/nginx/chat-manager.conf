# Chat Manager — Nginx site (Debian/Ubuntu). Replace chat.example.com and the
# paths; certificates from certbot (Let's Encrypt). Install:
#   sudo cp deploy/nginx/chat-manager.conf /etc/nginx/sites-available/chat-manager
#   sudo ln -s /etc/nginx/sites-available/chat-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Laravel must trust this proxy: TRUSTED_PROXIES=127.0.0.1 in .env.

# Plain HTTP only redirects (and serves the ACME challenge for certbot).
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.example.com;

    # The release directory is a symlink switched by deploy/scripts/deploy.sh.
    root /var/www/chat-manager/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads: WhatsApp media (WHATSAPP_DOCUMENT_MAX_BYTES, 16 MB by default),
    # contact imports (5 MB) and team chat files (10 MB) plus multipart overhead.
    # Keep in sync with upload_max_filesize/post_max_size of the PHP-FPM pool.
    client_max_body_size 24m;

    # Security headers are set by Laravel (App\Http\Middleware\SecurityHeaders);
    # only static assets need them here.
    server_tokens off;

    # Request id shared with Laravel logs: passed to PHP below
    # (HTTP_X_REQUEST_ID) and echoed by Laravel in the X-Request-Id header.

    access_log /var/log/nginx/chat-manager.access.log;
    error_log  /var/log/nginx/chat-manager.error.log warn;

    # Hidden files (.env, .git, .htaccess...) are never served.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Nothing outside public/ is reachable; block common sensitive files anyway.
    location ~* \.(env|log|sql|sqlite|bak|sh|ini|lock|yml|yaml|md)$ {
        deny all;
        return 404;
    }

    # Built assets: long cache (file names carry a content hash).
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Web chat loader: embedded by the host sites with a fixed name (no
    # content hash), so it gets a short cache instead of the immutable one.
    location = /widget/v1/chat-manager.js {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Laravel Reverb (WebSockets). Browsers connect to wss://chat.example.com/app/{key}.
    # Trailing slash and ^~: a bare "/app" prefix would also capture
    # /apple-touch-icon.png and any future /app... route.
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }

    # Reverb's HTTP API (/apps/...) is used only by the application from this
    # server (REVERB_HOST=127.0.0.1); it is not exposed publicly.
    location ^~ /apps/ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-chat-manager.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other PHP file is never executed.
    location ~ \.php$ {
        return 404;
    }

    error_page 404 /index.php;
}
