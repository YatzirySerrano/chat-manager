# Chat Manager — loopback-only endpoint for the WhatsApp Web (QR) service.
# Optional: install it only when the WhatsApp Web (QR) modality is used.
#   sudo cp deploy/nginx/chat-manager-internal.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/chat-manager-internal.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The service (services/whatsapp-web) posts its events and downloads the
# files of outgoing messages from Laravel under /internal/whatsapp-web/. This
# server answers those routes on 127.0.0.1 only, so they never travel over
# the Internet; set WAWEB_LARAVEL_URL=http://127.0.0.1:8091 in the service.
# Every request is still signed with the shared secret (HMAC) and Laravel
# refuses the unsigned ones.
#
# Then close the same routes on the public server: add to the 443 block of
# chat-manager.conf
#     location ^~ /internal/ { return 404; }
#
# Port 8091 is free in the provided templates (Reverb uses 8080 and the
# service itself 3410); change it if another project of the server uses it.
# Adjust the PHP-FPM socket to the one of chat-manager.conf.

server {
    listen 127.0.0.1:8091;
    server_name 127.0.0.1 localhost;

    root /var/www/chat-manager/current/public;
    index index.php;
    charset utf-8;

    access_log off;
    error_log /var/log/nginx/chat-manager-internal-error.log warn;

    # Events are small JSON documents; files are streamed out, not uploaded.
    client_max_body_size 2m;

    location ^~ /internal/whatsapp-web/ {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;
        fastcgi_pass unix:/run/php/php8.4-fpm-chat-manager.sock;
        fastcgi_read_timeout 120s;
        # Outgoing files are streamed straight from PHP to the service.
        fastcgi_buffering off;
    }

    # Nothing else is served here.
    location / {
        return 404;
    }
}
