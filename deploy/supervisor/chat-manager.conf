; Chat Manager — Supervisor programs (sudo cp to /etc/supervisor/conf.d/ and
; run: sudo supervisorctl reread && sudo supervisorctl update).
;
; One worker group per queue (App\Support\Queues, config/queue.php "names"),
; so heavy work never blocks the reception of messages:
;   critical       webhooks + messages  (webhook processing, outbound messages)
;   realtime       realtime             (real-time signals: new message, inboxes, team chat)
;   notifications  notifications        (in-app and administrative notifications)
;   media          media                (downloads/uploads to Meta)
;   default        default              (metrics, template sync, maintenance)
;   exports        exports              (Excel/PDF reports, contact imports; low priority)
; Workers use the default connection (QUEUE_CONNECTION: database or redis);
; never name a connection here or jobs pushed to the other one are never run.
; Rule: job timeout < worker --timeout < retry_after (DB_QUEUE_RETRY_AFTER /
; REDIS_QUEUE_RETRY_AFTER = 900). stopwaitsecs is above --timeout so a
; deployment never kills a running job.
; Restarts: startretries=20 keeps retrying while MariaDB/Redis start after a
; reboot (instead of FATAL after 3 attempts). Also order Supervisor after the
; database with a systemd drop-in, /etc/systemd/system/supervisor.service.d/override.conf:
;   [Unit]
;   After=mariadb.service redis-server.service
;   Wants=mariadb.service
; (add redis-server.service to Wants= when Redis is used), then
; sudo systemctl daemon-reload.
; Paths: /var/www/chat-manager/current is the active release; www-data the
; PHP-FPM user (adjust both).

[program:chatmanager-queue-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work --queue=webhooks,messages --sleep=1 --tries=3 --backoff=10 --timeout=150 --max-time=3600 --memory=256
directory=/var/www/chat-manager/current
user=www-data
numprocs=4
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-critical.log

; Real-time signals publish to Reverb over HTTP (timeout 5 s + connect 2 s
; per publication): --timeout=60 covers several publications per job.
[program:chatmanager-queue-realtime]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work --queue=realtime --sleep=1 --tries=3 --backoff=2 --timeout=60 --max-time=3600 --memory=256
directory=/var/www/chat-manager/current
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-realtime.log

[program:chatmanager-queue-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work --queue=notifications --sleep=1 --tries=3 --backoff=5 --timeout=120 --max-time=3600 --memory=256
directory=/var/www/chat-manager/current
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-notifications.log

[program:chatmanager-queue-media]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work --queue=media --sleep=2 --tries=3 --backoff=30 --timeout=180 --max-time=3600 --memory=512
directory=/var/www/chat-manager/current
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=210
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-media.log

[program:chatmanager-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work --queue=default --sleep=2 --tries=3 --backoff=10 --timeout=120 --max-time=3600 --memory=256
directory=/var/www/chat-manager/current
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-default.log

; EXPORTS_QUEUE=exports in .env (exports and contact imports run here).
; EXPORTS_JOB_TIMEOUT=600 < --timeout=660 < retry_after=900.
[program:chatmanager-queue-exports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work --queue=exports --sleep=3 --tries=1 --timeout=660 --max-time=7200 --memory=1024
directory=/var/www/chat-manager/current
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=700
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-exports.log

; Laravel Reverb (WebSockets), only on loopback; Nginx proxies /app.
[program:chatmanager-reverb]
command=php /var/www/chat-manager/current/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/chat-manager/current
user=www-data
autostart=true
autorestart=true
startretries=20
stopsignal=TERM
stopwaitsecs=10
minfds=10000
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/reverb.log

; Scheduler (alternative: the cron line in deploy/cron/chat-manager).
; Use only ONE of both, never both.
[program:chatmanager-scheduler]
command=php /var/www/chat-manager/current/artisan schedule:work
directory=/var/www/chat-manager/current
user=www-data
autostart=true
autorestart=true
startretries=20
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/scheduler.log

[group:chatmanager-workers]
programs=chatmanager-queue-critical,chatmanager-queue-realtime,chatmanager-queue-notifications,chatmanager-queue-media,chatmanager-queue-default,chatmanager-queue-exports
