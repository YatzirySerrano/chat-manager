; Chat Manager — dedicated PHP-FPM pool (sudo cp to /etc/php/8.4/fpm/pool.d/chat-manager.conf).
; A dedicated pool isolates the application (own user, socket and limits).
[chat-manager]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-chat-manager.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Size from measurements, not guesses: (RAM for PHP) / (average worker RSS).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

request_terminate_timeout = 75s
catch_workers_output = yes
decorate_workers_output = no

; Uploads (keep in sync with client_max_body_size in Nginx).
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/chatmanager/php-fpm-errors.log
php_admin_value[session.cookie_secure] = 1
php_admin_value[date.timezone] = UTC

; OPcache (production: files only change on deploy; php-fpm reload clears it).
php_admin_flag[opcache.enable] = on
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_flag[opcache.validate_timestamps] = off
