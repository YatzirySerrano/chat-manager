; Chat Manager — Supervisor programs (sudo cp to /etc/supervisor/conf.d/ and
; run: sudo supervisorctl reread && sudo supervisorctl update).
;
; Worker groups by priority (App\Support\Queues, config/queue.php "names"):
;   critical      webhooks + messages      (fast, several processes)
;   media         media                    (downloads/uploads to Meta)
;   general       notifications + default  (real-time signals, metrics, templates)
;   exports       exports                  (Excel/PDF, contacts import; long timeout)
; Rule: job timeout < worker --timeout < retry_after (DB_QUEUE_RETRY_AFTER=900).
; stopwaitsecs is above --timeout so a deployment never kills a running job.
; Paths: /var/www/chat-manager/current is the active release; www-data the
; PHP-FPM user (adjust both).

[program:chatmanager-queue-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work database --queue=webhooks,messages --sleep=1 --tries=3 --backoff=10 --timeout=150 --max-time=3600 --memory=256
directory=/var/www/chat-manager/current
user=www-data
numprocs=4
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-critical.log

[program:chatmanager-queue-media]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work database --queue=media --sleep=2 --tries=3 --backoff=30 --timeout=180 --max-time=3600 --memory=512
directory=/var/www/chat-manager/current
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=210
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-media.log

[program:chatmanager-queue-general]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work database --queue=notifications,default --sleep=1 --tries=3 --backoff=5 --timeout=120 --max-time=3600 --memory=256
directory=/var/www/chat-manager/current
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-general.log

; EXPORTS_QUEUE=exports in .env (exports and contact imports run here).
; EXPORTS_JOB_TIMEOUT=600 < --timeout=660 < DB_QUEUE_RETRY_AFTER=900.
[program:chatmanager-queue-exports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat-manager/current/artisan queue:work database --queue=exports --sleep=3 --tries=1 --timeout=660 --max-time=7200 --memory=1024
directory=/var/www/chat-manager/current
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=700
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/queue-exports.log

; Laravel Reverb (WebSockets), only on loopback; Nginx proxies /app.
[program:chatmanager-reverb]
command=php /var/www/chat-manager/current/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/chat-manager/current
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
minfds=10000
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/reverb.log

; Scheduler (alternative: the cron line in deploy/cron/chat-manager).
; Use only ONE of both, never both.
[program:chatmanager-scheduler]
command=php /var/www/chat-manager/current/artisan schedule:work
directory=/var/www/chat-manager/current
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/chatmanager/scheduler.log

[group:chatmanager-workers]
programs=chatmanager-queue-critical,chatmanager-queue-media,chatmanager-queue-general,chatmanager-queue-exports
